<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATH IDE Browser Acceptance Fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f4f6fb; color: #172033; font-family: Arial, sans-serif; }
    body { padding: 48px; }
    main { width: min(720px, 100%); margin: 0 auto; padding: 36px; background: #fff; border: 1px solid #dce2ed; border-radius: 16px; box-shadow: 0 12px 32px rgba(23,32,51,.08); }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.25; }
    p { color: #536079; }
    label { display: block; margin: 24px 0 8px; font-size: 14px; font-weight: 700; }
    input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #c8d1df; border-radius: 8px; font: inherit; }
    button { margin-top: 16px; height: 42px; padding: 0 18px; border: 0; border-radius: 8px; background: #263b73; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    #status { min-height: 24px; margin: 20px 0 0; color: #263b73; font-weight: 700; }
    @media (prefers-reduced-motion: no-preference) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main data-testid="browser-acceptance">
    <h1>ATH IDE Browser Acceptance Fixture</h1>
    <p>Deterministic fixture for browser interaction and visual-regression checks.</p>
    <label for="task">Task</label>
    <input id="task" aria-label="Task" autocomplete="off" />
    <button id="run" type="button">Run task</button>
    <p id="status" aria-live="polite">Ready</p>
  </main>
  <script>
    document.querySelector("#run").addEventListener("click", () => {
      document.querySelector("#status").textContent = document.querySelector("#task").value ? "Task queued" : "Enter a task";
    });
  </script>
</body>
</html>
