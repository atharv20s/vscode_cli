apiVersion: v1
kind: ServiceAccount
metadata:
  name: ath-ide-sa
  namespace: ath-ide
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ath-pod-manager-role
  namespace: ath-ide
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ath-pod-manager-binding
  namespace: ath-ide
subjects:
  - kind: ServiceAccount
    name: ath-ide-sa
    namespace: ath-ide
roleRef:
  kind: Role
  name: ath-pod-manager-role
  apiGroup: rbac.authorization.k8s.io
