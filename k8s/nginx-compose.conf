# Nginx Sticky Session Load Balancer for Multi-Replica Pods
upstream ath_ide_cluster {
    # Sticky sessions based on client IP: ensures WebSockets and IDE state stay pinned to same replica
    ip_hash;
    server core-pod-0:3001 max_fails=3 fail_timeout=10s;
    server core-pod-1:3001 max_fails=3 fail_timeout=10s;
    server core-pod-2:3001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Health check bypass
    location /api/health {
        proxy_pass http://ath_ide_cluster/api/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Cluster node registry query
    location /api/cluster/nodes {
        proxy_pass http://ath_ide_cluster/api/cluster/nodes;
        proxy_set_header Host $host;
    }

    # WebSocket Real-Time Terminal & Cursor Streaming
    location /ws {
        proxy_pass http://ath_ide_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # REST APIs & IDE UI
    location / {
        proxy_pass http://ath_ide_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}
