# Nginx High-Performance Reverse Proxy & WebSocket Load Balancer
# Architecture: Distributes traffic across ATH IDE multi-replica pods with sticky session pinning

upstream ath_ide_cluster {
    # ip_hash ensures WebSocket connections and cursor streams from the same IP stick to the same pod instance
    ip_hash;
    server ath-ide-core-0.ath-ide-service:3001 max_fails=3 fail_timeout=10s;
    server ath-ide-core-1.ath-ide-service:3001 max_fails=3 fail_timeout=10s;
    server ath-ide-core-2.ath-ide-service:3001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client payload size (supports large code/media uploads)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Health Check Endpoint (direct pass-through, no sticky required)
    location /api/health {
        proxy_pass http://ath_ide_cluster/api/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # WebSocket Real-Time Cursor & Agent Streaming
    location /ws {
        proxy_pass http://ath_ide_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive long WebSocket agent loops
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # REST APIs and Static Web Studio Assets
    location / {
        proxy_pass http://ath_ide_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}
