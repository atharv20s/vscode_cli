apiVersion: v1
kind: ConfigMap
metadata:
  name: ath-ide-config
  namespace: ath-ide
data:
  NODE_ENV: "production"
  PORT: "3001"
  WORKSPACE_ROOT: "/workspace"
  ENABLE_K8S_RUNNER: "true"
  DEFAULT_POD_CPU_LIMIT: "500m"
  DEFAULT_POD_MEM_LIMIT: "256Mi"
  K8S_NAMESPACE: "ath-ide"
---
apiVersion: v1
kind: Secret
metadata:
  name: ath-ide-secrets
  namespace: ath-ide
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_WITH_YOUR_OPENROUTER_KEY"
  TAVILY_API_KEY: "REPLACE_WITH_YOUR_TAVILY_KEY"
  JWT_SECRET: "REPLACE_WITH_RANDOM_32_CHAR_HEX_STRING"
  SESSION_SECRET: "REPLACE_WITH_RANDOM_32_CHAR_HEX_STRING"

