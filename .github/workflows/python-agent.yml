name: Python agent tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Agent/**"
      - "CLIENT/**"
      - "config/**"
      - "prompts/**"
      - "safety/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-agent.yml"
  push:
    branches: [main]
    paths:
      - "Agent/**"
      - "CLIENT/**"
      - "config/**"
      - "prompts/**"
      - "safety/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-agent.yml"

permissions:
  contents: read

jobs:
  python-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip openai
      - name: Compile Python packages
        run: python -m compileall -q Agent CLIENT config context hooks prompts safety tools
      - name: Run subagent tests
        run: python -m unittest discover -s tests -v
