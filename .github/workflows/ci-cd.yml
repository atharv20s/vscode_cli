name: ATH IDE — CI (AWS Lightsail production)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Production runs on AWS Lightsail. The Lightsail API and execution-worker
# services are managed on the instance; this workflow intentionally performs
# validation only and does not provision or deploy to a second cloud provider.
# AWS deployment automation can be added once its host-side deploy contract and
# GitHub Actions credentials are deliberately configured.

jobs:
  test:
    name: 🧪 Automated Test & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Code Syntax & Exports
        run: |
          find server/src -type f -name "*.js" -print0 | xargs -0 -n1 node --check
          find benchmarks -type f -name "*.mjs" -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: |
          cd server
          npm test

      - name: Install Playwright for browser acceptance
        run: |
          cd server
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run browser acceptance and visual regression
        run: |
          python3 -m http.server 4173 --directory benchmarks/fixtures/browser-acceptance >/tmp/ath-browser-fixture.log 2>&1 &
          echo $! >/tmp/ath-browser-fixture.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          cd server
          export APP_URL=http://127.0.0.1:4173
          export VISUAL_BASELINE_DIR=/tmp/ath-visual-baselines
          UPDATE_VISUAL_BASELINES=1 npm run bench:browser
          npm run bench:browser
          kill "$(cat /tmp/ath-browser-fixture.pid)" || true

  web-build:
    name: 🌐 Build and Type-check Studio Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Type-check frontend
        working-directory: web
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: web
        run: npm run build
