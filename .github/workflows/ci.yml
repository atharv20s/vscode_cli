name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Build / syntax checks
        working-directory: server
        run: npm run build

      - name: Test server
        working-directory: server
        run: npm test

      - name: Validate database maintenance scripts
        run: |
          node --check scripts/migrate-sqlite-to-postgres.mjs
          node --check scripts/neon-db-backup.mjs
          node --check server/scripts/audit-neon-migration-counts.mjs
          node --check server/scripts/verify-neon-backup-restore.mjs
          node --check server/scripts/run-production-acceptance.mjs
          node --check scripts/verify-multi-user-isolation-live.mjs
          node --check scripts/verify-s3-live.mjs
          node --check scripts/verify-s3-restore-live.mjs
          node --check scripts/verify-terminal-restart.mjs

  python-safety:
    name: Python agent and safety runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile agent, client, hooks, prompts and safety modules
        run: python -m compileall -q Agent CLIENT config hooks prompts safety tools tests

      - name: Run safety and lifecycle regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize providers without a remote backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate infrastructure configuration
        working-directory: terraform
        run: terraform validate
