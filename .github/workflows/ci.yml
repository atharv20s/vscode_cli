name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Build / syntax checks
        working-directory: server
        run: npm run build

      - name: Test server
        working-directory: server
        run: npm test

      - name: Validate SQLite-to-PostgreSQL migration script syntax
        run: node --check scripts/migrate-sqlite-to-postgres.mjs
