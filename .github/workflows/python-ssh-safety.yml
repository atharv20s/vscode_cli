name: Python SSH safety

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/builtin/shell.py"
      - "tests/test_python_shell_ssh.py"
      - ".github/workflows/python-ssh-safety.yml"

permissions:
  contents: read

jobs:
  python-ssh-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile relevant modules
        run: python -m compileall -q tools config
      - name: Run SSH boundary tests
        run: python -m unittest tests.test_python_shell_ssh -v
